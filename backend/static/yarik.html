<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Друг Ярика</title>

<meta name="theme-color" content="#0a1025">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

:root{
    --bg:#081122;
    --card:rgba(255,255,255,.08);
    --card-hover:rgba(255,255,255,.12);
    --border:rgba(255,255,255,.14);
    --text:#fff;
    --muted:rgba(255,255,255,.7);
    --accent:#5da9ff;
    --success:#4ade80;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    min-height:100%;
}

body{
    font-family:
    Inter,
    system-ui,
    sans-serif;

    min-height:100dvh;

    color:var(--text);

    background:
    radial-gradient(circle at top left,#2b7fff 0%,transparent 30%),
    radial-gradient(circle at bottom right,#4d8cff 0%,transparent 25%),
    linear-gradient(180deg,#0a1025,#081122);

    overflow-x:hidden;

    padding:
    calc(env(safe-area-inset-top) + 24px)
    20px
    calc(env(safe-area-inset-bottom) + 24px);

    transition:.5s ease;
}

/* Aurora */

.aurora{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.25;
    animation:float 14s ease-in-out infinite;
}

.blob:nth-child(1){
    width:350px;
    height:350px;
    background:#5da9ff;
    top:-120px;
    left:-120px;
}

.blob:nth-child(2){
    width:280px;
    height:280px;
    background:#67e8f9;
    right:-80px;
    top:35%;
}

.blob:nth-child(3){
    width:220px;
    height:220px;
    background:#8b5cf6;
    bottom:-80px;
    left:30%;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-40px);
    }
}

/* Layout */

main{
    max-width:720px;
    margin:auto;

    min-height:calc(100dvh - 48px);

    display:flex;
    flex-direction:column;
    justify-content:center;

    transition:.6s ease;
}

.hero{
    text-align:center;
    transition:.6s ease;
}

.avatar-wrap{
    position:relative;
    width:220px;
    height:220px;
    margin:auto;
}

.avatar-glow{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
    radial-gradient(circle,
    rgba(93,169,255,.4),
    transparent 70%);
    animation:pulse 4s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
}

.avatar{
    position:absolute;
    inset:0;

    border-radius:50%;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(30px);

    border:1px solid rgba(255,255,255,.15);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:110px;

    animation:bob 5s ease-in-out infinite;
}

@keyframes bob{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-12px);
    }
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:10px 16px;

    border-radius:999px;

    background:rgba(255,255,255,.08);

    border:1px solid var(--border);

    margin-bottom:24px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--success);
}

h1{
    font-size:clamp(38px,6vw,56px);
    margin-top:24px;
}

.subtitle{
    margin-top:12px;
    color:var(--muted);
    font-size:18px;
    line-height:1.5;
}

.dynamic-message{
    margin-top:18px;
    color:#c7dcff;
    min-height:28px;
}

/* Cards */

.cards{
    margin-top:40px;

    display:grid;

    grid-template-columns:
    repeat(2,minmax(0,1fr));

    gap:14px;

    transition:.6s ease;
}

.card{
    border:none;

    border-radius:24px;

    background:var(--card);

    backdrop-filter:blur(24px);

    border:1px solid var(--border);

    color:white;

    cursor:pointer;

    padding:18px;

    text-align:left;

    transition:.25s ease;
}

.card:hover{
    transform:translateY(-4px);
    background:var(--card-hover);
}

.card-title{
    font-weight:700;
    margin-bottom:6px;
}

.card-desc{
    font-size:14px;
    color:var(--muted);
}

/* Footer */

footer{
    text-align:center;
    margin-top:40px;
    color:rgba(255,255,255,.5);
    font-size:14px;
}

/* Talking mode */

body.talking-mode .hero,
body.talking-mode .cards,
body.talking-mode footer{

    opacity:0;
    pointer-events:none;

    transform:
    translateY(20px)
    scale(.96);
}

body.talking-mode{
    background:
    linear-gradient(
    180deg,
    #081122,
    #050914);
}

/* Mobile */

@media(max-width:640px){

    .avatar-wrap{
        width:180px;
        height:180px;
    }

    .avatar{
        font-size:90px;
    }

    .cards{
        gap:12px;
    }

    .card{
        padding:16px;
    }
}

</style>
</head>
<body>

<div class="aurora">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
</div>

<main>

<section class="hero">

<div class="badge">
    <div class="dot"></div>
    <span>Онлайн</span>
</div>

<div class="avatar-wrap">
    <div class="avatar-glow"></div>
    <div class="avatar">😊</div>
</div>

<h1 id="greeting"></h1>

<p class="subtitle">
Всегда рад пообщаться, поиграть или узнать что-нибудь новое.
</p>

<div
class="dynamic-message"
id="dynamicMessage">
</div>

</section>

<section class="cards">

<button class="card">
<div class="card-title">🎮 Игры</div>
<div class="card-desc">
Поиграем вместе
</div>
</button>

<button class="card">
<div class="card-title">🌍 Интересные факты</div>
<div class="card-desc">
Удивительные вещи о мире
</div>
</button>

<button class="card">
<div class="card-title">🚀 Космос</div>
<div class="card-desc">
Планеты, звёзды и ракеты
</div>
</button>

<button class="card">
<div class="card-title">♟️ Шахматы</div>
<div class="card-desc">
Задачи и идеи
</div>
</button>

<button class="card">
<div class="card-title">🎨 Рисование</div>
<div class="card-desc">
Творческие идеи
</div>
</button>

<button class="card">
<div class="card-title">🐱 Животные</div>
<div class="card-desc">
Самые интересные факты
</div>
</button>

<button class="card">
<div class="card-title">🇬🇧 Английский</div>
<div class="card-desc">
Учимся играя
</div>
</button>

<button class="card">
<div class="card-title">🇨🇳 Китайский</div>
<div class="card-desc">
Новые слова каждый день
</div>
</button>

</section>

<footer>
Твой друг всегда рядом 💙
</footer>

</main>

<script>

/* Greeting */

const hour = new Date().getHours();

let greeting = "Привет, Ярик!";

if(hour < 12){
 greeting = "Доброе утро, Ярик!";
}else if(hour < 18){
 greeting = "Привет, Ярик!";
}else{
 greeting = "Добрый вечер, Ярик!";
}

document
.getElementById("greeting")
.textContent = greeting;

/* Dynamic phrases */

const phrases = [
"Как проходит твой день?",
"Хочешь поиграть?",
"Расскажи что-нибудь интересное!",
"Я знаю много интересных фактов 🌍",
"Могу помочь с английским 🇬🇧",
"Могу рассказать про космос 🚀",
"Или просто поболтаем 😊"
];

let index = 0;

const message =
document.getElementById(
"dynamicMessage"
);

message.textContent = phrases[0];

setInterval(()=>{

 if(
 document.body.classList.contains(
 "talking-mode"
 )
 ) return;

 index++;

 if(index >= phrases.length){
   index = 0;
 }

 message.textContent =
 phrases[index];

},4000);

/* Widget Observer */

function observeWidget(){

 const widget =
 document.getElementById(
 "wellcomeai-widget-container"
 );

 if(!widget){
   requestAnimationFrame(
   observeWidget
   );
   return;
 }

 const observer =
 new MutationObserver(()=>{

   if(
   widget.classList.contains(
   "active"
   )
   ){
      document.body.classList.add(
      "talking-mode"
      );
   }else{
      document.body.classList.remove(
      "talking-mode"
      );
   }

 });

 observer.observe(widget,{
   attributes:true,
   attributeFilter:["class"]
 });

}

observeWidget();

/* Open widget from cards */

document
.querySelectorAll(".card")
.forEach(card=>{

 card.addEventListener(
 "click",
 ()=>{

 const btn =
 document.getElementById(
 "wellcomeai-widget-button"
 );

 if(btn){
    btn.click();
 }

 });

});

</script>

<!-- WellcomeAI Gemini Voice Assistant -->

    var script = document.createElement('script');
    script.src = 'https://voicyfy.ru/static/gemini-widget.js';
    script.dataset.assistantId = '6e6cb139-66f7-4c10-a9be-fb7470e86945';
    script.dataset.server = 'https://voicyfy.ru';
    script.dataset.position = 'bottom-right';
    script.async = true;
    document.head.appendChild(script);
})();
</script>
<!-- End WellcomeAI Gemini -->

</body>
</html>
